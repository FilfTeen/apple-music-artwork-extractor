name: Checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        extra: [""]
        include:
          - python-version: "3.12"
            extra: ui
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel from source distribution
        run: python -m build
      - name: Check distribution contents
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from email.parser import BytesParser
          import tarfile
          import tomllib
          import zipfile

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          distribution = project["name"].replace("-", "_")
          version = project["version"]
          base = f"{distribution}-{version}"
          metadata_files = {
              "METADATA", "WHEEL", "RECORD", "entry_points.txt", "top_level.txt",
          }
          egg_files = {
              "PKG-INFO", "SOURCES.txt", "dependency_links.txt", "entry_points.txt",
              "requires.txt", "top_level.txt",
          }
          root_files = {"LICENSE", "README.md", "CONTRIBUTING.md", "CHANGELOG.md", "pyproject.toml", "MANIFEST.in", "PKG-INFO", "setup.cfg"}
          docs = {f"docs/{name}.md" for name in ("TECHNICAL", "STATUS", "AGENT_INTERFACE")}
          guide = "apple_music_artwork/resources/apple-artwork-operator/SKILL.md"
          license_body = Path("LICENSE").read_bytes()
          wheel_license = f"{base}.dist-info/licenses/LICENSE"

          def source_allowed(path):
              parts = path.parts
              return (
                  str(path) in root_files | docs
                  or str(path) == "src/" + guide
                  or len(parts) == 3 and parts[:2] == ("src", "apple_music_artwork") and path.suffix == ".py"
                  or len(parts) == 3 and parts[:2] == ("src", f"{distribution}.egg-info") and path.name in egg_files
                  or len(parts) > 1 and parts[0] == "tests" and path.suffix in {".py", ".json", ".md"}
                  or len(parts) == 2 and parts[0] == "examples" and path.suffix == ".json"
              )

          def inspect_path(path):
              assert not path.is_absolute() and ".." not in path.parts, path
              assert not any(part.startswith(".") for part in path.parts), path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1, "expected exactly one wheel and one sdist"
          with zipfile.ZipFile(wheels[0]) as archive:
              assert archive.read(wheel_license) == license_body
              metadata = BytesParser().parsebytes(archive.read(f"{base}.dist-info/METADATA"))
              assert metadata["License-Expression"] == "MIT"
              assert metadata.get_all("License-File") == ["LICENSE"]
              for name in archive.namelist():
                  path = PurePosixPath(name)
                  assert (
                      len(path.parts) == 2 and path.parts[0] == "apple_music_artwork" and path.suffix == ".py"
                      or str(path) == guide
                      or str(path) == wheel_license
                      or len(path.parts) == 2 and path.parts[0] == f"{base}.dist-info" and path.name in metadata_files
                  ), path
                  inspect_path(path)
                  archive.read(name)
          with tarfile.open(sdists[0]) as archive:
              assert archive.extractfile(f"{base}/LICENSE").read() == license_body
              metadata = BytesParser().parsebytes(archive.extractfile(f"{base}/PKG-INFO").read())
              assert metadata["License-Expression"] == "MIT"
              assert metadata.get_all("License-File") == ["LICENSE"]
              for member in archive.getmembers():
                  path = PurePosixPath(member.name)
                  assert path.parts[0] == base and ".." not in path.parts, path
                  assert not member.issym() and not member.islnk(), path
                  if member.isdir():
                      continue
                  assert member.isfile(), path
                  relative = PurePosixPath(*path.parts[1:])
                  assert source_allowed(relative), relative
                  inspect_path(relative)
                  archive.extractfile(member).read()
          print("wheel and sdist contents match the intended package files")
          PY
      - name: Install the built wheel
        env:
          ARTWORK_EXTRA: ${{ matrix.extra }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys
          wheel, = Path("dist").glob("*.whl")
          extra = os.environ["ARTWORK_EXTRA"]
          subprocess.run([sys.executable, "-m", "pip", "install", str(wheel) + (f"[{extra}]" if extra else "")], check=True)
          PY
      - name: Run base-dependency tests against installed package
        env:
          ARTWORK_EXTRA: ${{ matrix.extra }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from importlib.util import find_spec
          from importlib.metadata import version
          import os
          import shutil
          import sys
          import tempfile
          import unittest
          import apple_music_artwork

          assert not Path(apple_music_artwork.__file__).resolve().is_relative_to(Path("src").resolve())
          assert apple_music_artwork.__version__ == version("apple-music-artwork")
          assert find_spec("m3u8") is None, "this job must exercise base dependencies only"
          assert (find_spec("rich") is not None) == (os.environ["ARTWORK_EXTRA"] == "ui")

          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item

          discovered = list(cases(unittest.defaultTestLoader.discover("tests")))
          optional = [case for case in discovered if case.id().startswith(("test_hls.", "test_execution_motion.", "test_execution_runtime.ExecutionMotionRuntimeTests.", "test_execution_v04.MotionDecisionTests.", "test_remote_check.MotionObservationTests.", "test_cli_v05.CliUpdateMotionFailureTests."))]
          assert optional, "expected explicitly separated optional-parser coverage"
          suite = unittest.TestSuite(case for case in discovered if case not in optional)
          assert suite.countTestCases() > 0, "test discovery returned no tests"
          print(f"Base job: {suite.countTestCases()} tests; {len(optional)} parser tests run in media job")
          with tempfile.TemporaryDirectory(prefix="no-media-tools-", dir=os.environ["RUNNER_TEMP"]) as empty_tools:
              os.environ["PATH"] = empty_tools
              assert shutil.which("ffmpeg") is None and shutil.which("ffprobe") is None
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
      - name: Check installed command entry points
        run: |
          apple-artwork --help
          apple-music-artwork --version
          python -m apple_music_artwork --version
          apple-artwork 'https://music.apple.com/us/playlist/example/pl.example' --response examples/response.json --list --json
          apple-artwork capabilities --json
          apple-artwork capabilities --guide

  media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        extra: ["motion", "motion,ui"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build and media tools
        run: |
          python -m pip install build
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Build and install wheel with motion extra
        env:
          ARTWORK_EXTRA: ${{ matrix.extra }}
        shell: bash
        run: |
          python -m build
          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1
          subprocess.run([sys.executable, "-m", "pip", "install", str(wheels[0]) + "[" + os.environ["ARTWORK_EXTRA"] + "]"], check=True)
          PY
      - name: Run complete offline tests against installed package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from importlib.metadata import version
          import sys
          import unittest
          import apple_music_artwork
          import m3u8

          assert not Path(apple_music_artwork.__file__).resolve().is_relative_to(Path("src").resolve())
          assert apple_music_artwork.__version__ == version("apple-music-artwork")
          assert callable(m3u8.loads)
          suite = unittest.defaultTestLoader.discover("tests")
          assert suite.countTestCases() > 0
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(not result.wasSuccessful())
          PY
      - name: Generate owned H264 and exercise real CLI decoding
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          root = Path(tempfile.mkdtemp(prefix="artwork-media-", dir=os.environ["RUNNER_TEMP"]))
          sys.path.insert(0, "tests")
          from test_cli_media_tools import generate_owned_inputs

          ffmpeg, ffprobe = shutil.which("ffmpeg"), shutil.which("ffprobe")
          assert ffmpeg and ffprobe
          fixture, bframes = generate_owned_inputs(root, ffmpeg, ffprobe)
          # Report both owned inputs before the CLI assertion can stop the job.
          from fractions import Fraction
          from hashlib import sha256
          import json
          from types import SimpleNamespace
          from apple_music_artwork.errors import ArtworkError
          from apple_music_artwork.motion import MediaTools, validate_motion

          tools = MediaTools.discover(ffmpeg=ffmpeg, ffprobe=ffprobe)
          versions = {}
          for name, executable in (("ffmpeg", ffmpeg), ("ffprobe", ffprobe)):
              result = subprocess.run([executable, "-version"], capture_output=True, text=True, timeout=30)
              versions[name] = {"exit": result.returncode, "version": result.stdout.splitlines()[0]}
          print("MEDIA_DIAGNOSTIC_TOOLS " + json.dumps(versions, sort_keys=True), flush=True)
          for sample, expected_fps in ((fixture, 2), (bframes, 24)):
              probe = subprocess.run([
                  ffprobe, "-v", "error", "-protocol_whitelist", "file",
                  "-show_packets", "-show_entries", "format=format_name,start_time,duration,size:stream=index,codec_name,codec_type,width,height,avg_frame_rate,r_frame_rate,start_pts,start_time,duration_ts,duration,time_base,pix_fmt,color_range,color_space,color_transfer,color_primaries:stream_disposition=attached_pic:packet=stream_index,pts,dts,duration,flags",
                  "-of", "json", "-i", str(sample),
              ], capture_output=True, text=True, timeout=30)
              evidence = {"sample": sample.name, "hls_frame_rate": expected_fps,
                          "bytes": sample.stat().st_size, "sha256": sha256(sample.read_bytes()).hexdigest(),
                          "probe_exit": probe.returncode}
              if probe.returncode == 0:
                  observed = json.loads(probe.stdout)
                  evidence["streams"] = observed.get("streams", [])
                  evidence["packets"] = observed.get("packets", [])
                  stream, = evidence["streams"]
                  time_base = Fraction(stream["time_base"])
                  intervals = sorted((int(p["pts"]), int(p["duration"])) for p in evidence["packets"])
                  span = (max(start + duration for start, duration in intervals) - intervals[0][0]) * time_base
                  minimum = min(duration for _, duration in intervals) * time_base
                  evidence["presentation_span_seconds"] = str(span)
                  evidence["minimum_packet_duration_seconds"] = str(minimum)
                  evidence["presentation_maximum_fps"] = str(1 / minimum)
              broad = subprocess.run([
                  ffprobe, "-v", "error", "-select_streams", "v:0", "-show_streams",
                  "-show_format", "-show_packets", "-of", "json", str(sample),
              ], capture_output=True, text=True, timeout=30)
              evidence["broad_probe"] = {"exit": broad.returncode}
              if broad.returncode == 0:
                  broad_stream = json.loads(broad.stdout)["streams"][0]
                  evidence["broad_probe"].update({key: broad_stream.get(key) for key in ("avg_frame_rate", "r_frame_rate")})
              inspection = SimpleNamespace(
                  supported=True,
                  selected=SimpleNamespace(codec="h264", width=64, height=64, frame_rate=expected_fps),
                  layout=SimpleNamespace(content_length=evidence["bytes"], duration=1 if expected_fps == 2 else 2))
              try:
                  validated = validate_motion(sample, inspection, tools, {"bytes": evidence["bytes"], "sha256": evidence["sha256"]})
                  evidence["product_validation"] = {"status": "passed", "decoded_frames": validated["decoded_frames"]}
              except ArtworkError as error:
                  evidence["product_validation"] = {"status": "rejected", "code": error.code}
              decoded = subprocess.run([
                  ffmpeg, "-nostdin", "-v", "error", "-xerror", "-protocol_whitelist", "file",
                  "-i", str(sample), "-map", "0:v:0", "-an", "-sn", "-dn",
                  "-progress", "pipe:1", "-f", "null", "-",
              ], capture_output=True, text=True, timeout=60)
              progress = dict(line.split("=", 1) for line in decoded.stdout.splitlines() if "=" in line)
              evidence["full_decode"] = {"exit": decoded.returncode, **{
                  key: progress.get(key) for key in ("frame", "out_time_us", "dup_frames", "drop_frames", "progress")}}
              print("MEDIA_DIAGNOSTIC_SAMPLE " + json.dumps(evidence, sort_keys=True), flush=True)
          subprocess.run([
              sys.executable, "-B", "tests/test_cli_media_tools.py", "--input-video", str(fixture),
              "--bframes-video", str(bframes), "--output-root", str(root),
              "--ffmpeg", ffmpeg, "--ffprobe", ffprobe, "--require-installed",
          ], check=True, timeout=180)
          PY
